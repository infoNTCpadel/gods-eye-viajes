<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin · Diario de viaje</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#14100c;color:#e8ddc4;font-family:system-ui,-apple-system,sans-serif;padding:16px;max-width:640px;margin:0 auto}
h1{font-size:22px;color:#e8c877}
.card{background:#1d1710;border:1px solid #3a2c18;border-radius:12px;padding:16px;margin-top:12px}
label{display:block;margin-top:10px;font-size:14px;color:#b8a888}
input{width:100%;margin-top:4px;padding:14px;border-radius:10px;border:1px solid #3a2c18;background:#241b0f;color:#e8ddc4;font-size:16px}
.row{display:flex;gap:10px;margin-top:14px}
button{background:#d9a441;color:#14100c;border:0;border-radius:10px;padding:14px 18px;font-size:16px;font-weight:800;min-height:52px}
button.sec{background:#3a2c18;color:#e8c877}
button:active{transform:scale(.96)}
.mini{font-size:13px;color:#b8a888}
.trip{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border:1px solid #3a2c18;border-radius:11px;margin-top:8px;background:#181209}
.trip b{display:block}
code{background:#241b0f;padding:2px 8px;border-radius:6px;color:#e8c877;font-size:15px}
#msg{margin-top:10px;font-weight:700}
</style>
</head>
<body>
<h1>🔒 Admin · crear viajes</h1>
<div class="mini">Esta página es semi-privada: compártela solo con quien vaya a crear viajes. Los compañeros se unen con el código o el enlace de invitación.</div>

<div class="card">
  <label>Nombre del viaje<input id="tName" placeholder="Rioja con amigos"></label>
  <label>Tu apodo (así te verá el grupo)<input id="tNick" placeholder="Mateo"></label>
  <label>Destino (opcional, para el tiempo y curiosidades)<input id="tDest" placeholder="Logroño"></label>
  <div class="row"><button id="btnCreate">Crear viaje</button></div>
  <div id="msg"></div>
</div>

<div class="card">
  <b>Viajes creados</b>
  <div id="trips"><div class="mini">Cargando…</div></div>
</div>

<script>
const $=id=>document.getElementById(id);
async function api(path,body){
  const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||('Error '+r.status));
  return d;
}
function inviteLink(code){ return location.origin+'/?join='+code; }
async function load(){
  try{
    const d=await api('/api/admin/trips');
    $('trips').innerHTML=d.trips.length?d.trips.map(t=>
      '<div class="trip"><div><b>'+esc(t.name)+'</b><div class="mini">'+(t.destination?esc(t.destination)+' · ':'')+t.members+' personas · código <code>'+esc(t.inviteCode)+'</code></div></div>'+
      '<button class="sec" data-c="'+esc(t.inviteCode)+'">Copiar enlace</button></div>'
    ).join(''):'<div class="mini">Aún no hay viajes.</div>';
    $('trips').querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const u=inviteLink(b.dataset.c);
      if(navigator.clipboard) navigator.clipboard.writeText(u).catch(()=>{});
      b.textContent='Copiado ✓'; setTimeout(()=>b.textContent='Copiar enlace',1500);
    });
  }catch(e){ $('trips').innerHTML='<div class="mini">Error: '+esc(e.message)+'</div>'; }
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
$('btnCreate').onclick=async()=>{
  const name=$('tName').value.trim(), nick=$('tNick').value.trim(), dest=$('tDest').value.trim();
  if(!name){ $('msg').textContent='Pon un nombre al viaje.'; return; }
  if(!nick){ $('msg').textContent='Pon tu apodo.'; return; }
  $('msg').textContent='Creando…';
  try{
    const d=await api('/api/trips',{name:name,nickname:nick,destination:dest});
    const u=inviteLink(d.trip.inviteCode);
    if(navigator.clipboard) navigator.clipboard.writeText(u).catch(()=>{});
    $('msg').innerHTML='Viaje creado. Código <code>'+esc(d.trip.inviteCode)+'</code> — enlace copiado, pásalo por WhatsApp.';
    $('tName').value=''; $('tDest').value='';
    load();
  }catch(e){ $('msg').textContent='Error: '+e.message; }
};
load();
</script>
</body>
</html>
