services:
  gods-eye-viajes:
    build: .
    container_name: gods-eye-viajes
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.godseye.entrypoints=websecure"
      - "traefik.http.routers.godseye.rule=Host(`${DOMAIN:-viajes.ntcpadel.com}`)"
      - "traefik.http.routers.godseye.tls.certresolver=letsencrypt"
      - "traefik.http.services.godseye.loadbalancer.server.port=80"
    networks:
      - web

# La red "web" debe ser la misma red a la que esta conectado Traefik.
# En tu VPS Traefik enruta contenedores que comparten su red. Si tu red
# externa se llama distinto (p.ej. traefik, proxy), cambiala aqui y en .env
# no hace falta: solo renombra el name: de abajo.
networks:
  web:
    external: true
    name: ${TRAEFIK_NETWORK:-web}

# Alternativa si Traefik usa network_mode host en tu VPS y no red externa:
# comenta networks: del servicio y de abajo y usa en su lugar:
#     network_mode: bridge
# entonces Traefik debe llegar al puerto publicado; en ese caso anade:
#     ports: ["127.0.0.1:8088:80"]
# y ajusta el label de puerto a 8088. La opcion por defecto (red web
# externa) es la que usa knbacademy en tu VPS.
