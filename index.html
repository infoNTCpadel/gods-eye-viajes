<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14100c">
<title>Diario de viaje</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#14100c;color:#f3ead6;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.topbar{position:sticky;top:0;z-index:1200;background:linear-gradient(#1d1710,#14100c);padding:10px 14px;border-bottom:1px solid #3a2c18}
.topbar .brand{font-size:18px;color:#e8c877;font-weight:800}
.topbar .tripname{font-size:15px;font-weight:700;margin-top:4px}
.topbar .nowline{font-size:12px;color:#b8a888;margin-top:2px}
.wrap{padding:12px 14px 110px;max-width:720px;margin:0 auto}
.tab{display:none}.tab.active{display:block}
h2{font-size:19px;color:#e8c877;margin:6px 0 10px}
#map{height:52vh;min-height:320px;border-radius:14px;border:1px solid #3a2c18;background:#0d0a07}
.leaflet-container{background:#0d0a07}
.leaflet-tile{filter:grayscale(1) invert(0.92) brightness(0.9) contrast(0.9) sepia(0.25)}
button{background:#d9a441;color:#14100c;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:16px;min-height:56px;width:100%}
button.sec{background:#2a2114;color:#f3ead6;border:1px solid #4a3a20}
button.warn{background:#a63d40;color:#fff}
button.big{min-height:64px;font-size:18px}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row>*{flex:1}
.card{background:#1d1710;border:1px solid #3a2c18;border-radius:12px;padding:14px;margin-top:10px}
label{font-size:13px;color:#b8a888;display:block;margin-top:10px}
input,select,textarea{width:100%;margin-top:4px;background:#0f0c08;color:#f3ead6;border:1px solid #4a3a20;border-radius:9px;padding:12px;font-size:16px}
textarea{min-height:64px}
input.amount{font-size:34px;font-weight:800;text-align:center;color:#e8c877;padding:14px}
.mini{font-size:13px;color:#b8a888;line-height:1.5}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.actions button{padding:8px 10px;font-size:13px;min-height:44px;width:auto}
.toast{position:fixed;left:12px;right:12px;bottom:96px;z-index:2000;background:#f3ead6;color:#14100c;padding:12px;border-radius:11px;font-weight:700;display:none;box-shadow:0 8px 30px #000}
a{color:#e8c877}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:1500;display:flex;background:#1d1710;border-top:1px solid #3a2c18;padding-bottom:env(safe-area-inset-bottom)}
.bottomnav button{flex:1;background:transparent;color:#b8a888;border:0;border-radius:0;font-size:13px;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bottomnav button .ic{font-size:24px}
.bottomnav button.on{color:#e8c877;background:#2a2114;box-shadow:inset 0 3px 0 #d9a441}
.topbtns{display:flex;gap:8px;margin-top:8px}
.topbtns button{min-height:44px;font-size:14px;padding:8px}
.grouph{font-size:15px;color:#e8c877;margin:18px 0 8px;font-weight:800;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}
.fab{position:fixed;right:16px;bottom:92px;z-index:1700;width:64px;height:64px;min-height:64px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 8px 24px #000;display:none;align-items:center;justify-content:center}
#lightbox{display:none;position:fixed;inset:0;z-index:2500;background:rgba(8,6,4,.96);padding:16px;overflow-y:auto}
#lightbox img{width:100%;max-height:60vh;object-fit:contain;border-radius:10px}
#lightbox .t{font-weight:800;font-size:20px;margin-top:10px}
#lightbox .n{font-size:15px;color:#e8ddc4;margin-top:4px}
#lightbox .m{font-size:13px;color:#b8a888;margin-top:4px}
.catchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.catchips button{width:auto;min-height:48px;padding:10px 14px;background:#2a2114;color:#f3ead6;border:1px solid #4a3a20;font-size:15px}
.catchips button.on{background:#d9a441;color:#14100c}
.catchips button.off{opacity:.45}
.bal{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid #3a2c18;border-radius:11px;margin-top:8px;background:#181209}
.bal .v{font-size:22px;font-weight:800}
.bal .pos{color:#7fb069}.bal .neg{color:#c95d63}.bal .zero{color:#b8a888}
.expense{padding:12px;border:1px solid #3a2c18;border-radius:11px;margin-top:8px;background:#181209}
.expense .amt{font-size:20px;font-weight:800;color:#e8c877}
.settle{padding:10px;border:1px dashed #4a3a20;border-radius:11px;margin-top:8px}
.sharebar{position:sticky;top:0;z-index:1100;background:#221a0e;border:1px solid #d9a441;border-radius:12px;padding:12px;margin-bottom:10px;font-weight:700}
.memberrow{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #3a2c18;border-radius:11px;margin-top:8px;background:#181209}
.avatar{width:38px;height:38px;border-radius:50%;background:#d9a441;color:#14100c;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 38px}
.avatar.off{background:#3a2c18;color:#b8a888}
.durchips button.on{background:#7fb069;color:#14100c}
.cards .place img,#pPreview{width:100%;max-height:220px;object-fit:cover;border-radius:9px;margin-top:8px}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">📖 Diario de viaje</div>
  <div id="hdrTrip" class="tripname" style="display:none"></div>
  <div id="hdrMembers" class="nowline" style="display:none"></div>
  <div class="topbtns" id="hdrChangeRow" style="display:none"><button id="btnShareTrip" class="sec">Compartir viaje</button><button id="btnChangeTrip" class="sec">Cambiar viaje</button></div>
</div>
<div class="wrap">

  <!-- EMPEZAR -->
  <section id="tab-start" class="tab">
    <h2>📖 Diario de viaje</h2>
    <div id="serverError" class="card" style="display:none;border-color:#a63d40"><b>⚠️ Sin conexión con el servidor.</b></div>
    <div id="sessionCard" class="card" style="display:none"></div>
    <div id="sharePanel" class="card" style="display:none;border-color:#d9a441"></div>
    <div id="importBanner" class="card" style="display:none;border-color:#d9a441"></div>
    <div class="card">
      <h2 style="margin-top:0">Crear viaje</h2>
      <label>Nombre del viaje<input id="tName" placeholder="Rioja con amigos"></label>
      <label>Tu apodo<input id="tNick" placeholder="Mateo"></label>
      <div class="row">
        <button id="btnCreate">Crear viaje</button>
      </div>
    </div>
    <div class="card">
      <h2 style="margin-top:0">Unirme con código</h2>
      <label>Código<input id="jCode" placeholder="K7PX3M" style="text-transform:uppercase" maxlength="6"></label>
      <label>Tu apodo<input id="jNick" placeholder="Ana"></label>
      <div class="row">
        <button id="btnJoin" class="sec">Entrar</button>
      </div>
    </div>
    <div class="card" id="leaveCard" style="display:none">
      <div class="row"><button id="btnLeave" class="sec">Salir de este viaje</button></div>
    </div>
  </section>

  <!-- DIARIO -->
  <section id="tab-diario" class="tab">
    <h2>Diario</h2>
    <div id="days"></div>
    <div class="row"><button id="btnTogglePhotoForm">📸 Añadir foto</button></div>
    <div id="photoFormWrap" class="card" style="display:none">
      <label>Foto<input id="pPhoto" type="file" accept="image/*" capture="environment"></label>
      <img id="pPreview" style="display:none">
      <p class="mini" id="photoWarn"></p>
      <label>Título<input id="pTitle" placeholder="Plaza del pueblo"></label>
      <label>Nota (opcional)<input id="pNote" placeholder="Vistas increíbles"></label>
      <div class="row"><button id="btnPlace">Guardar en el viaje</button></div>
    </div>
  </section>

  <!-- GASTOS -->
  <section id="tab-gastos" class="tab">
    <h2>Gastos del viaje</h2>
    <div id="potBox"></div>
    <div id="balances"></div>
    <div class="row"><button id="btnToggleExpForm" class="big">＋ Añadir gasto</button></div>
    <div id="expFormWrap" class="card" style="display:none">
      <label>Importe<input id="eAmount" class="amount" inputmode="decimal" placeholder="0,00"></label>
      <label>Descripción<input id="eDesc" placeholder="Cena"></label>
      <div id="potToggleWrap" class="catchips" style="display:none;margin-top:10px">
        <button type="button" id="btnFromPot">🫙 Pagado del bote</button>
      </div>
      <label id="payerLabel">Quién pagó</label>
      <div class="catchips" id="payerChips"></div>
      <label>Participan</label>
      <div class="catchips" id="partChips"></div>
      <label>Reparto</label>
      <div class="catchips" id="modeChips">
        <button type="button" data-mode="equal">Igual</button>
        <button type="button" data-mode="amounts">Cantidades</button>
        <button type="button" data-mode="shares">Participaciones</button>
      </div>
      <div id="splitInputs"></div>
      <div id="splitPreview" class="card" style="border-color:#d9a441;font-size:15px;line-height:1.8"></div>
      <label>Foto del ticket (opcional)<input id="ePhoto" type="file" accept="image/*" capture="environment"></label>
      <img id="ePreview" style="display:none;width:100%;max-height:160px;object-fit:cover;border-radius:9px;margin-top:8px">
      <div class="row"><button id="btnExpense">Guardar gasto</button></div>
    </div>
    <div class="grouph">Movimientos</div>
    <div id="expenses"></div>
    <div class="grouph">Saldar cuentas</div>
    <div id="settleList"></div>
    <div class="card">
      <label>Registrar pago</label>
      <div class="row" style="margin-top:0">
        <div><label>De<select id="sFrom"></select></label></div>
        <div><label>A<select id="sTo"></select></label></div>
        <div><label>Importe<input id="sAmount" inputmode="decimal" placeholder="0,00"></label></div>
      </div>
      <div class="row"><button id="btnSettle" class="sec">Registrar pago</button></div>
      <div id="settlements"></div>
    </div>
  </section>

  <!-- DONDE ESTAMOS -->
  <section id="tab-donde" class="tab">
    <h2>Dónde estamos</h2>
    <div id="shareBanner" class="sharebar" style="display:none"></div>
    <div class="card">
      <div id="shareCtl">
        <button id="btnShareToggle" class="big">📍 Compartir mi ubicación</button>
        <div id="durChips" class="catchips durchips" style="display:none;margin-top:10px">
          <button type="button" data-min="15">15 min</button>
          <button type="button" data-min="60" class="on">1 hora</button>
          <button type="button" data-min="480">8 horas</button>
        </div>
      </div>
      <p class="mini" style="margin-top:8px">Solo se ve tu posición si lo activas. Caduca solo y nadie te ve cuando lo apagas.</p>
    </div>
    <div id="map" style="margin-top:10px"></div>
    <div id="members"></div>
  </section>

</div>
<button id="btnFabCam" class="fab" title="Añadir foto">📸</button>

<nav class="bottomnav" id="bottomNav">
  <button data-tab="diario"><span class="ic">📖</span>Diario</button>
  <button data-tab="gastos"><span class="ic">💶</span>Gastos</button>
  <button data-tab="donde"><span class="ic">📍</span>Dónde estamos</button>
</nav>
<div id="toast" class="toast"></div>
<div id="lightbox"><div style="text-align:right"><button id="btnCloseLb" class="sec" style="width:auto">Cerrar</button></div><img id="lbImg" alt=""><div class="t" id="lbTitle"></div><div class="n" id="lbNote"></div><div class="m" id="lbMeta"></div><div class="actions" id="lbActions"></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SES_KEY='godsEyeViajes_v2session';
const DEV_KEY='godsEyeViajes_v2device';
const MODE_KEY='godsEyeViajes_v2splitmode';
let session=loadJson(SES_KEY,null);           // {tripId,inviteCode,memberToken,memberId,nickname,role}
let serverState=null;                          // {trip,members,places,expenses,settlements,balances,whoPaysWhom}
let photoData='', ticketData='';
let lastPos=null, geoWatch=null;
let sharing={on:false, until:0};
let expMode=localStorage.getItem(MODE_KEY)||'equal';
let expPayer='', expParts={};
let expFromPot=false;
function loadJson(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } }
function deviceId(){ let d=localStorage.getItem(DEV_KEY); if(!d){ d='dev-'+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem(DEV_KEY,d); } return d; }
function isOrganizer(){ return !!(session && session.role==='organizer'); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',3600); }
function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtEuro(cents){ return (cents/100).toFixed(2).replace('.',',')+' €'; }
function parseAmt(v){ v=String(v||'').trim().replace(/\./g,'').replace(',','.'); return parseFloat(v)||0; }
function hhmm(iso){ try{ const d=new Date(iso); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }catch(e){ return ''; } }

/* API */
async function api(path, opts){
  opts=opts||{};
  const headers=Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(session && session.memberToken && opts.auth!==false) headers['X-Member-Token']=session.memberToken;
  const res=await fetch(path, {method:opts.method||'GET', headers:headers, body:opts.body?JSON.stringify(opts.body):undefined});
  let data={}; try{ data=await res.json(); }catch(e){}
  if(!res.ok){ const e=new Error(data.error||('Error '+res.status)); e.status=res.status; throw e; }
  return data;
}
async function checkHealth(){ try{ const r=await fetch('/api/health'); const d=await r.json(); return !!d.ok; }catch(e){ return false; } }
async function refreshState(silent){
  if(!session) { serverState=null; redraw(); return; }
  try{
    const st=await api('/api/trips/by-code/'+encodeURIComponent(session.inviteCode));
    serverState=st;
    if(st.trip){ session.tripId=st.trip.id; session.inviteCode=st.trip.inviteCode; localStorage.setItem(SES_KEY,JSON.stringify(session)); }
    redraw();
  }catch(e){
    if(e.status===401 || e.status===403){ session=null; localStorage.removeItem(SES_KEY); serverState=null; redraw(); showTab('start'); toast('Tu sesión ya no vale. Vuelve a unirte con el código.'); }
    else if(!silent){ toast('No se pudo actualizar: '+e.message); }
  }
}
async function heartbeat(){
  if(!session) return;
  let body={sharing:false};
  if(sharing.on){
    if(Date.now()>=sharing.until){ setSharing(false); toast('Has dejado de compartir ubicación (tiempo agotado).'); }
    else if(lastPos){ body={lat:lastPos[0],lng:lastPos[1],sharing:true,sharingMinutes:Math.ceil((sharing.until-Date.now())/60000)}; }
  }
  try{ await api('/api/trips/'+session.tripId+'/heartbeat',{method:'POST',body:body}); }catch(e){}
}

/* TABS */
function showTab(name){
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  const pane=document.getElementById('tab-'+name); if(pane) pane.classList.add('active');
  document.querySelectorAll('#bottomNav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
  if(name==='donde'){ setTimeout(()=>{ try{map.invalidateSize()}catch(e){} },80); }
  const fab=document.getElementById('btnFabCam');
  if(fab) fab.style.display=(session && name==='diario')?'flex':'none';
  window.scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll('#bottomNav button').forEach(b=>b.addEventListener('click',()=>{
  if(!session){ showTab('start'); toast('Primero crea tu viaje o únete con el código.'); return; }
  showTab(b.dataset.tab);
}));
document.getElementById('btnChangeTrip').onclick=()=>showTab('start');
document.getElementById('btnShareTrip').onclick=()=>{ showTab('start'); const sp=document.getElementById('sharePanel'); if(sp){ sp.style.display='block'; sp.scrollIntoView({behavior:'smooth',block:'center'}); } };

/* MAPA (solo compañeros compartiendo) */
const map=L.map('map',{zoomControl:true}).setView([41.55,2.1],10);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);
let locMarkers={};
function personIcon(nick){ return L.divIcon({className:'',html:'<div style="background:#d9a441;border:2px solid #14100c;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#14100c;box-shadow:0 2px 10px #000">'+esc(nick.charAt(0).toUpperCase())+'</div>',iconSize:[36,36],iconAnchor:[18,18]}); }

/* HEADER */
function inviteLink(){ return location.origin+location.pathname+'?join='+encodeURIComponent(session?session.inviteCode:''); }
function renderSession(){
  const sc=document.getElementById('sessionCard'), lc=document.getElementById('leaveCard');
  const hdrT=document.getElementById('hdrTrip'), hdrM=document.getElementById('hdrMembers'), hdrR=document.getElementById('hdrChangeRow');
  if(!session){ sc.style.display='none'; lc.style.display='none'; hdrT.style.display='none'; hdrM.style.display='none'; hdrR.style.display='none'; const fab0=document.getElementById('btnFabCam'); if(fab0) fab0.style.display='none'; return; }
  const t=serverState && serverState.trip;
  sc.style.display='block'; lc.style.display='block';
  sc.innerHTML='<b>'+esc(t?t.name:'Viaje')+'</b> · '+esc(session.nickname)+(isOrganizer()?' · organizador':'');
  const sp=document.getElementById('sharePanel'); if(sp) sp.innerHTML='<b>Código</b><div style="font-size:34px;letter-spacing:4px;color:#e8c877;font-weight:800;margin:8px 0">'+esc(session.inviteCode)+'</div><div class="row"><button id="btnShare2" class="sec">Compartir por WhatsApp</button></div><div class="row"><input id="shareLink2" readonly value="'+esc(inviteLink())+'"></div>';
  const b2=document.getElementById('btnShare2'); if(b2) b2.onclick=shareInvite;
  hdrT.style.display='block'; hdrT.textContent='📖 '+(t?t.name:'Tu viaje');
  hdrR.style.display='flex';
  const mem=(serverState && serverState.members)||[];
  if(mem.length){ hdrM.style.display='block'; hdrM.textContent='👥 '+mem.map(m=>m.nickname).join(' · '); }
}
function redraw(){
  renderSession();
  renderDiary(); renderExpenses(); renderWhere();
}

/* DIARIO — fotos por día */
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function dayKey(iso){ const d=new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayLabel(iso){ const d=new Date(iso); return DIAS[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()]; }
function renderDiary(){
  const box=document.getElementById('days');
  const places=(serverState && serverState.places)||[];
  if(!places.length){ box.innerHTML='<div class="card">Aún no hay fotos. Sé el primero 📸</div>'; return; }
  const groups={};
  places.slice().sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)).forEach(p=>{ const k=dayKey(p.createdAt); (groups[k]=groups[k]||[]).push(p); });
  const keys=Object.keys(groups).sort();
  box.innerHTML=keys.map(k=>{
    const ps=groups[k];
    return '<div class="grouph">'+esc(dayLabel(ps[0].createdAt))+' · '+ps.length+' foto'+(ps.length>1?'s':'')+'</div><div class="grid">'+
      ps.map(p=>'<img loading="lazy" src="'+esc(p.photoUrl||'icon.svg')+'" onclick="openLb(\''+p.id+'\')" alt="">').join('')+'</div>';
  }).join('');
}
window.openLb=id=>{
  const p=(serverState.places||[]).find(x=>x.id===id); if(!p) return;
  document.getElementById('lbImg').src=p.photoUrl||'';
  document.getElementById('lbTitle').textContent=p.title||'';
  document.getElementById('lbNote').textContent=p.note||'';
  document.getElementById('lbMeta').textContent=(p.author?'por '+p.author:'')+' · '+hhmm(p.createdAt)+' · '+dayLabel(p.createdAt);
  const mine=session && (session.memberId===p.memberId || isOrganizer());
  document.getElementById('lbActions').innerHTML=mine?'<button class="sec" onclick="delPlace(\''+p.id+'\')">Eliminar</button>':'';
  document.getElementById('lightbox').style.display='block';
};
document.getElementById('btnCloseLb').onclick=()=>document.getElementById('lightbox').style.display='none';
window.delPlace=id=>{ if(!session) return; if(!confirm('¿Eliminar esta foto del viaje?')) return; (async()=>{ try{ const r=await fetch('/api/places/'+id,{method:'DELETE',headers:{'X-Member-Token':session.memberToken}}); if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.error||'Error '+r.status); } document.getElementById('lightbox').style.display='none'; await refreshState(true); toast('Foto eliminada.'); }catch(e){ toast('Error: '+e.message); } })(); };

/* FOTO → servidor */
function compressFile(file, done){
  const img=new Image();
  img.onload=()=>{ const cv=document.createElement('canvas'); const sc=Math.min(1,900/Math.max(img.width,1)); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc); cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); done(cv.toDataURL('image/jpeg',.72)); URL.revokeObjectURL(img.src); };
  img.onerror=()=>toast('No se pudo leer la foto.');
  img.src=URL.createObjectURL(file);
}
document.getElementById('pPhoto').addEventListener('change',e=>{

document.getElementById('ePhoto').addEventListener('change',e=>{

document.getElementById('btnTogglePhotoForm').onclick=()=>{ const w=document.getElementById('photoFormWrap'); const open=w.style.display!=='none'; if(open){ w.style.display='none'; document.getElementById('btnTogglePhotoForm').textContent='📸 Añadir foto'; } else openPhotoForm(false); };

document.getElementById('btnPlace').onclick=async()=>{

    await refreshState(true); toast('Guardado en el diario 📸');

};

/* GASTOS */
/* BOTE COMUN */
function renderPot(){
  const box=document.getElementById('potBox'); if(!box) return;
  const wrap=document.getElementById('potContribWrap');
  if(wrap && wrap.style.display!=='none') return; // no pisar mientras se escribe el importe
  const pot=(serverState && serverState.pot)||{};
  const mem=members();
  if(!pot.treasurer){
    box.innerHTML='<div class="card"><b>🫙 Bote común</b><div class="mini">¿Hacéis fondo común? Elegid quién lo lleva.</div><div class="catchips" style="margin-top:8px">'+mem.map(m=>'<button type="button" data-n="'+esc(m.nickname)+'">'+esc(m.nickname)+'</button>').join('')+'</div></div>';
    box.querySelectorAll('button').forEach(b=>b.onclick=async()=>{
      try{ await api('/api/trips/'+session.tripId+'/treasurer',{method:'POST',body:{nickname:b.dataset.n}}); await refreshState(true); toast('El bote lo lleva '+b.dataset.n+' 🫙'); }
      catch(e){ toast('Error: '+e.message); }
    });
    return;
  }
  box.innerHTML='<div class="card" style="border-color:#d9a441"><b>🫙 Bote: '+esc(pot.treasurer)+'</b><div class="mini">aportado '+esc(pot.contributed)+' · gastado del bote '+esc(pot.spentFromPot)+' · quedan <b>'+esc(pot.remaining)+'</b></div>'
    +((pot.pendingCents||0)>0?'<div class="mini" style="color:#d9a441">＋'+esc(fmtEuro(pot.pendingCents))+' pendientes de confirmar</div>':'')
    +(((pot.pendingList)||[]).some(p=>session&&p.nickname===session.nickname)?'<div class="mini">⏳ Tu aportación está pendiente de que '+esc(pot.treasurer)+' la confirme.</div>':'')
    +'<div class="row"><button id="btnPotContrib">Aportar al bote</button></div>'
    +'<div id="potContribWrap" style="display:none;margin-top:8px"><div class="mini">Aportas como <b>'+esc(session?session.nickname:'')+'</b>. El bote lo confirma '+esc(pot.treasurer)+'.</div><label>Importe<input id="potAmount" class="amount" inputmode="decimal" placeholder="0,00"></label><div class="row"><button id="btnPotGo">Aportar</button></div></div>'
    +renderPendingList()+'</div>';
  document.getElementById('btnPotContrib').onclick=()=>{
    const w=document.getElementById('potContribWrap'); w.style.display=(w.style.display==='none')?'block':'none';
  };
  document.getElementById('btnPotGo').onclick=async()=>{
    const amount=parseAmt(document.getElementById('potAmount').value);
    if(amount<=0){ toast('Pon el importe.'); return; }
    try{
      await api('/api/trips/'+session.tripId+'/pot/contribute',{method:'POST',body:{amount:amount}});
      document.getElementById('potAmount').value=''; document.getElementById('potContribWrap').style.display='none';
      await refreshState(true); toast('Aportación enviada 🫙 El bote la confirma.');
    }catch(e){ toast('Error: '+e.message); }
  };
}
/* Aportaciones pendientes: solo el tesorero confirma/rechaza */
function renderPendingList(){
  const pot=(serverState && serverState.pot)||{};
  const pend=pot.pendingList||[];
  if(!pend.length) return '';
  const you=(serverState && serverState.you)||{};
  let h='<div class="grouph" style="margin-top:10px">Por confirmar ('+pend.length+')</div>';
  h+=pend.map(p=>'<div class="bal"><div><b>'+esc(p.nickname)+'</b><div class="mini">⏳ '+esc(p.amount)+'</div></div>'
    +(you.isTreasurer?'<div style="display:flex;gap:6px"><button onclick="confirmContrib(\''+p.id+'\',true)">Confirmar</button><button class="sec" onclick="confirmContrib(\''+p.id+'\',false)">Rechazar</button></div>':'')
    +'</div>').join('');
  return h;
}
window.confirmContrib=async(id,ok)=>{
  if(!session) return;
  if(!ok && !confirm('¿Rechazar esta aportación? Desaparecerá de las cuentas.')) return;
  try{
    await api('/api/trips/'+session.tripId+'/pot/contributions/'+id+'/confirm',{method:'POST',body:{ok:ok}});
    await refreshState(true); toast(ok?'Aportación confirmada ✔':'Aportación rechazada.');
  }catch(e){ toast('Error: '+e.message); }
};
function members(){ return (serverState && serverState.members)||[]; }
function splitPreview(){
  const total=parseAmt(document.getElementById('eAmount').value);
  const box=document.getElementById('splitPreview'), inputs=document.getElementById('splitInputs');
  const names=Object.keys(expParts).filter(n=>expParts[n].on);
  document.querySelectorAll('#modeChips button').forEach(b=>b.classList.toggle('on',b.dataset.mode===expMode));
  inputs.innerHTML='';
  if(total<=0 || !names.length){ box.innerHTML='<span class="mini">Escribe el importe y verás aquí lo que toca a cada uno.</span>'; return; }
  let lines=[];
  if(expMode==='equal'){
    const cents=Math.round(total*100), base=Math.floor(cents/names.length), rem=cents-base*names.length;
    names.forEach((n,i)=>lines.push(n+' → '+fmtEuro(base+(i<rem?1:0))));
  } else if(expMode==='amounts'){
    names.forEach(n=>{ const v=parseFloat(String(expParts[n].val||'').replace(',','.'))||0; lines.push(n+' → '+fmtEuro(Math.round(v*100))); });
    inputs.innerHTML='<label>Cantidades por persona</label>'+names.map(n=>'<label style="margin-top:6px">'+esc(n)+'<input data-p="'+esc(n)+'" class="pval" inputmode="decimal" placeholder="0,00" value="'+esc(expParts[n].val||'')+'"></label>').join('');
    inputs.querySelectorAll('.pval').forEach(i=>i.addEventListener('input',()=>{ expParts[i.dataset.p].val=i.value; splitPreview(); }));
  } else {
    names.forEach(n=>{ lines.push(n+' → '+(parseFloat(String(expParts[n].val||'1').replace(',','.'))||1)+' partes'); });
    inputs.innerHTML='<label>Participaciones</label>'+names.map(n=>'<label style="margin-top:6px">'+esc(n)+'<input data-p="'+esc(n)+'" class="pval" inputmode="decimal" placeholder="1" value="'+esc(expParts[n].val||'')+'"></label>').join('');
    inputs.querySelectorAll('.pval').forEach(i=>i.addEventListener('input',()=>{ expParts[i.dataset.p].val=i.value; splitPreview(); }));
  }
  box.innerHTML='<b>'+fmtEuro(Math.round(total*100))+'</b> se reparte:<br>'+lines.join('<br>');
}
function renderExpenses(){
  renderPot();
  const bs=(serverState && serverState.balances)||[];
  const bBox=document.getElementById('balances');
  if(!bs.length){ bBox.innerHTML=''; }
  else {
    bBox.innerHTML='<div class="grouph" style="margin-top:0">Balances</div>'+bs.map(b=>{
      const c=b.balanceCents===0?'zero':(b.balanceCents>0?'pos':'neg');
      const t=b.balanceCents===0?'en paz':(b.balanceCents>0?'le deben':'debe');
      return '<div class="bal"><div><b>'+esc(b.nickname)+'</b><br><span class="mini">pagó '+esc(b.paid)+' · su parte '+esc(b.share)+'</span></div><div class="v '+c+'">'+(b.balanceCents>0?'+':'')+esc(b.balance)+'<div class="mini" style="text-align:right">'+t+'</div></div></div>';
    }).join('');
  }
  // formulario: chips
  const mem=members();
  const pot0=(serverState && serverState.pot)||{};
  if(expFromPot && pot0.treasurer) expPayer=pot0.treasurer;
  if(!expPayer && session) expPayer=session.nickname;
  document.getElementById('payerChips').innerHTML=mem.map(m=>'<button type="button" data-n="'+esc(m.nickname)+'" class="'+(m.nickname===expPayer?'on':'')+'">'+esc(m.nickname)+'</button>').join('');
  document.querySelectorAll('#payerChips button').forEach(b=>b.onclick=()=>{ expPayer=b.dataset.n; renderExpenses(); });
  // toggle "pagado del bote"
  const ptw=document.getElementById('potToggleWrap');
  if(pot0.treasurer){ ptw.style.display='flex'; } else { ptw.style.display='none'; expFromPot=false; }
  const bfp=document.getElementById('btnFromPot');
  if(bfp){ bfp.classList.toggle('on',expFromPot); bfp.onclick=()=>{ expFromPot=!expFromPot; renderExpenses(); splitPreview(); }; }
  const pc=document.getElementById('payerChips');
  pc.style.opacity=expFromPot?'.45':''; pc.style.pointerEvents=expFromPot?'none':'';
  const pl=document.getElementById('payerLabel');
  if(pl) pl.textContent=expFromPot?('Pagado del bote ('+pot0.treasurer+')'):'Quién pagó';
  mem.forEach(m=>{ if(!(m.nickname in expParts)) expParts[m.nickname]={on:true,val:''}; });
  document.getElementById('partChips').innerHTML=mem.map(m=>'<button type="button" data-n="'+esc(m.nickname)+'" class="'+(expParts[m.nickname].on?'on':'off')+'">'+(expParts[m.nickname].on?'✓ ':'')+esc(m.nickname)+'</button>').join('');
  document.querySelectorAll('#partChips button').forEach(b=>b.onclick=()=>{ const n=b.dataset.n; expParts[n].on=!expParts[n].on; renderExpenses(); });
  document.querySelectorAll('#modeChips button').forEach(b=>b.onclick=()=>{ expMode=b.dataset.mode; localStorage.setItem(MODE_KEY,expMode); splitPreview(); });
  // lista de gastos
  const ex=(serverState && serverState.expenses)||[];
  document.getElementById('expenses').innerHTML=ex.length?ex.slice().reverse().map(e=>{
    const mine=session && (session.memberId===e.authorMemberId || isOrganizer());
    const badge=e.kind==='contribution'?('<span class="mini" style="color:'+(e.status==='pending'?'#d9a441':'#7fb069')+'">'+(e.status==='pending'?'⏳ pendiente':'🫙 bote')+'</span> '):(e.fromPot?'<span class="mini" style="color:#d9a441">del bote</span> ':'');
    return '<div class="expense"><div style="display:flex;justify-content:space-between;align-items:center"><b>'+badge+esc(e.description)+'</b><span class="amt">'+esc(e.amount)+'</span></div><div class="mini">Pagó '+esc(e.payer)+' · '+hhmm(e.createdAt)+'</div><div class="mini">'+e.parts.map(p=>esc(p.nickname)+' '+(p.cents/100).toFixed(2).replace('.',',')+'€').join(' · ')+'</div>'+(e.photoUrl?'<img src="'+esc(e.photoUrl)+'" style="width:100%;max-height:140px;object-fit:cover;border-radius:8px;margin-top:6px">':'')+(mine?'<div class="actions"><button class="sec" onclick="delExpense(\''+e.id+'\')">Eliminar</button></div>':'')+'</div>';
  }).join(''):'<div class="card">Sin gastos todavía.</div>';
  // saldar
  const w=(serverState && serverState.whoPaysWhom)||[];
  document.getElementById('settleList').innerHTML=w.length?w.map(s=>'<div class="settle"><b>'+esc(s.from)+'</b> → <b>'+esc(s.to)+'</b>: <b>'+esc(s.amount)+'</b></div>').join(''):'<div class="mini">Todo en paz 🎉</div>';
  const st=(serverState && serverState.settlements)||[];
  document.getElementById('settlements').innerHTML=st.length?st.slice().reverse().map(s=>'<div class="mini" style="margin-top:6px">'+esc(s.from)+' → '+esc(s.to)+': <b>'+esc(s.amount)+'</b> · '+hhmm(s.createdAt)+'</div>').join(''):'<div class="mini" style="margin-top:6px">Ningún pago registrado.</div>';
  document.getElementById('sFrom').innerHTML=mem.map(m=>'<option>'+esc(m.nickname)+'</option>').join('');
  document.getElementById('sTo').innerHTML=mem.map(m=>'<option>'+esc(m.nickname)+'</option>').join('');
}
document.getElementById('btnToggleExpForm').onclick=()=>{ const w=document.getElementById('expFormWrap'); const open=w.style.display!=='none'; if(open){ w.style.display='none'; document.getElementById('btnToggleExpForm').textContent='＋ Añadir gasto'; } else { w.style.display='block'; document.getElementById('btnToggleExpForm').textContent='Cerrar'; renderExpenses(); splitPreview(); } };
document.getElementById('eAmount').addEventListener('input',splitPreview);
document.getElementById('btnExpense').onclick=async()=>{
  if(!session){ showTab('start'); return; }
  const amount=parseAmt(document.getElementById('eAmount').value);
  if(amount<=0){ toast('Pon el importe.'); return; }
  const names=Object.keys(expParts).filter(n=>expParts[n].on);
  if(!names.length){ toast('Elige quién participa.'); return; }
  let parts=names.map(n=>({nickname:n}));
  if(expMode==='amounts'){ parts=names.map(n=>({nickname:n, amount:parseFloat(String(expParts[n].val||'0').replace(',','.'))||0})); }
  else if(expMode==='shares'){ parts=names.map(n=>({nickname:n, share:parseFloat(String(expParts[n].val||'1').replace(',','.'))||1})); }
  try{
    await api('/api/trips/'+session.tripId+'/expenses',{method:'POST',body:{description:document.getElementById('eDesc').value.trim()||'Gasto', amount:amount, payer:expPayer||session.nickname, participants:parts, split_mode:expMode, from_pot:expFromPot, photo:ticketData||''}});
    document.getElementById('eAmount').value=''; document.getElementById('eDesc').value=''; ticketData=''; document.getElementById('ePreview').style.display='none'; document.getElementById('ePhoto').value='';
    expFromPot=false;
    document.getElementById('expFormWrap').style.display='none'; document.getElementById('btnToggleExpForm').textContent='＋ Añadir gasto';
    await refreshState(true); toast('Gasto guardado 💶');
  }catch(e){ toast('Error: '+e.message); }
};
window.delExpense=id=>{ if(!session) return; if(!confirm('¿Eliminar este gasto?')) return; (async()=>{ try{ const r=await fetch('/api/expenses/'+id,{method:'DELETE',headers:{'X-Member-Token':session.memberToken}}); if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.error||'Error '+r.status); } await refreshState(true); toast('Gasto eliminado.'); }catch(e){ toast('Error: '+e.message); } })(); };
document.getElementById('btnSettle').onclick=async()=>{
  const frm=document.getElementById('sFrom').value, to=document.getElementById('sTo').value;
  const amount=parseAmt(document.getElementById('sAmount').value);
  if(amount<=0){ toast('Pon el importe del pago.'); return; }
  try{
    await api('/api/trips/'+session.tripId+'/settlements',{method:'POST',body:{from:frm,to:to,amount:amount}});
    document.getElementById('sAmount').value='';
    await refreshState(true); toast('Pago registrado ✔');
  }catch(e){ toast('Error: '+e.message); }
};

/* DONDE ESTAMOS */
function renderWhere(){
  const mem=members();
  const active=mem.filter(m=>m.sharing && m.lastLat!=null);
  Object.values(locMarkers).forEach(m=>map.removeLayer(m)); locMarkers={};
  active.forEach(m=>{ locMarkers[m.id]=L.marker([m.lastLat,m.lastLng],{icon:personIcon(m.nickname)}).addTo(map).bindPopup('<b>'+esc(m.nickname)+'</b> · quedan ~'+m.sharingLeftMin+' min'); });
  if(active.length){
    try{ map.fitBounds(L.latLngBounds(active.map(m=>[m.lastLat,m.lastLng])),{padding:[40,40]}); }catch(e){}
  }
  document.getElementById('members').innerHTML=mem.map(m=>{
    const me=session && m.nickname===session.nickname;
    const st=m.sharing?('📍 comparte · quedan ~'+m.sharingLeftMin+' min'):'no comparte ubicación';
    return '<div class="memberrow"><div class="avatar'+(m.sharing?'':' off')+'">'+esc(m.nickname.charAt(0).toUpperCase())+'</div><div style="flex:1"><b>'+esc(m.nickname)+'</b>'+(me?' (tú)':'')+'<br><span class="mini">'+st+'</span></div></div>';
  }).join('');
  const banner=document.getElementById('shareBanner');
  if(sharing.on && Date.now()<sharing.until){
    const left=Math.ceil((sharing.until-Date.now())/60000);
    banner.style.display='block';
    banner.innerHTML='📍 Compartiendo tu ubicación · quedan ~'+left+' min · <button class="sec" style="width:auto;min-height:44px;padding:8px 14px" onclick="setSharing(false)">Dejar de compartir</button>';
  } else banner.style.display='none';
  const btn=document.getElementById('btnShareToggle');
  btn.textContent=sharing.on?'⏹ Dejar de compartir':'📍 Compartir mi ubicación';
  btn.className=sharing.on?'warn big':'big';
  document.getElementById('durChips').style.display=(!sharing.on && session)?'flex':'none';
}
document.querySelectorAll('#durChips button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#durChips button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  setSharing(true, Number(b.dataset.min));
});
document.getElementById('btnShareToggle').onclick=()=>{ setSharing(!sharing.on, currentDur()); };
function currentDur(){ const on=document.querySelector('#durChips button.on'); return on?Number(on.dataset.min):60; }
window.setSharing=function(on, minutes){
  if(on){
    if(!navigator.geolocation){ toast('Este navegador no da GPS.'); return; }
    sharing={on:true, until:Date.now()+(minutes||60)*60000};
    if(!geoWatch) geoWatch=navigator.geolocation.watchPosition(
      p=>{ lastPos=[p.coords.latitude,p.coords.longitude]; },
      e=>{ toast('Sin GPS: '+e.message); setSharing(false); },
      {enableHighAccuracy:true,maximumAge:8000,timeout:15000});
    toast('Compartiendo ubicación '+(minutes||60)+' min. Se apaga solo.');
  } else {
    sharing={on:false, until:0};
    if(geoWatch){ navigator.geolocation.clearWatch(geoWatch); geoWatch=null; }
  }
  heartbeat(); renderWhere();
};

/* SESION: crear / unirse / salir */
function setSessionFromResponse(d, nickname){
  session={tripId:d.trip.id, inviteCode:d.trip.inviteCode, memberToken:d.memberToken, memberId:(d.member&&d.member.id)||'', nickname:(d.member&&d.member.nickname)||nickname, role:(d.member&&d.member.role)||'member'};
  localStorage.setItem(SES_KEY,JSON.stringify(session));
  expPayer=session.nickname;
}
document.getElementById('btnCreate').onclick=async()=>{
  const name=document.getElementById('tName').value.trim(); const nick=document.getElementById('tNick').value.trim();
  if(!name){ toast('Pon un nombre al viaje.'); return; }
  if(!nick){ toast('Pon tu apodo (así te verá el grupo).'); return; }
  try{
    const d=await api('/api/trips',{method:'POST', auth:false, body:{name:name, nickname:nick, deviceId:deviceId()}});
    setSessionFromResponse(d, nick);
    await refreshState(true); heartbeat();
    toast('Viaje creado. Código '+session.inviteCode+' — compártelo solo con tu grupo.');
    showTab('diario');
  }catch(e){ document.getElementById('serverError').style.display='block'; toast('Error al crear: '+e.message); }
};
document.getElementById('btnJoin').onclick=async()=>{
  const code=document.getElementById('jCode').value.trim().toUpperCase(); const nick=document.getElementById('jNick').value.trim();
  if(!code){ toast('Pon el código del viaje.'); return; }
  if(!nick){ toast('Pon tu apodo (así te verá el grupo).'); return; }
  try{
    const d=await api('/api/trips/join',{method:'POST', auth:false, body:{code:code, nickname:nick, deviceId:deviceId()}});
    setSessionFromResponse(d, nick);
    await refreshState(true); heartbeat();
    toast('Dentro: '+d.trip.name+'.');
    showTab('diario');
  }catch(e){ toast(e.status===404?'Ese código no existe. Revísalo con quien te lo pasó.':'Error al unirse: '+e.message); }
};
document.getElementById('btnLeave').onclick=()=>{ if(confirm('¿Salir de este viaje en este móvil? El viaje seguirá en el servidor para el grupo.')){ setSharing(false); session=null; localStorage.removeItem(SES_KEY); serverState=null; redraw(); showTab('start'); toast('Has salido del viaje en este móvil.'); } };

/* COMPARTIR INVITACION (?join=CODIGO) */
function shareInvite(){
  if(!session){ toast('Primero entra en un viaje.'); return; }
  const url=inviteLink();
  const t=serverState && serverState.trip;
  const txt='📖 Diario de viaje: '+(t?t.name:'nuestro viaje')+'\nCódigo: '+session.inviteCode+'\nEntra aquí y pon tu apodo: '+url;
  if(navigator.clipboard) navigator.clipboard.writeText(url).catch(()=>{});
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
  toast('Invitación generada y copiada. WhatsApp abierto.');
}
(function bootParams(){
  const q=new URLSearchParams(location.search); const j=q.get('join');
  if(j){ document.getElementById('jCode').value=j.toUpperCase(); const b=document.getElementById('importBanner'); b.style.display='block'; b.innerHTML='Invitación: pon tu apodo y entra 👇'; }
  if(q.get('join')) history.replaceState({},'',location.pathname);
})();

/* ARRANQUE + SONDEO */
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
redraw();
showTab(session?'diario':'start');
(async()=>{
  const ok=await checkHealth();
  if(!ok){ document.getElementById('serverError').style.display='block'; return; }
  if(session){ await refreshState(true); heartbeat(); showTab('diario'); }
})();
setInterval(()=>{ if(session) refreshState(true); },15000);
setInterval(heartbeat,30000);
